<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Личный кабинет</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo" style="background-image: url('img/logo.png');"></div>
    </a>

    <nav class="nav">
        <a href="auth.html" id="auth-link" style="display: none;">Вход/регистрация</a>
        <a href="promotions.html">Акции</a>
        <a href="delivery.html">Доставка</a>
        <a href="admin.html">Админ панель</a>
        <a href="profile.html" class="active">Личный кабинет</a>
    </nav>

    <div class="search">
        <input type="text" placeholder="Найти...">
        <button>ОК</button>
    </div>
</header>

<div class="wrapper">

    <main class="content">
        <section class="profile-section">
            <h1>Личный кабинет</h1>
            
            <div class="profile-info" id="profile-info"></div>

            <div class="profile-tabs">
                <button class="profile-tab-btn active" data-tab="orders">Мои заказы</button>
                <button class="profile-tab-btn" data-tab="cart">Корзина</button>
                <button class="profile-tab-btn" data-tab="favorites">Избранное</button>
            </div>

            <div class="profile-content">
                <div class="profile-tab-content active" id="orders-tab">
                    <h3>История заказов</h3>
                    <div class="orders-list" id="orders-list"></div>
                </div>

                <div class="profile-tab-content" id="cart-tab">
                    <h3>Корзина покупок</h3>
                    <div class="cart-items" id="cart-items"></div>
                    <div class="cart-total" id="cart-total"></div>
                </div>

                <div class="profile-tab-content" id="favorites-tab">
                    <h3>Избранные товары</h3>
                    <div class="favorites-list" id="favorites-list"></div>
                </div>
            </div>

            <div class="profile-actions">
                <button class="logout-btn" onclick="logout()">Выйти из системы</button>
            </div>
        </section>
    </main>

</div>

<footer class="footer">
    <div class="footer-content">
        Адрес: Улица Привет Драйв, дом 7, Лондон<br>
        Телефон: +7 (900) 123-45-67<br>
        Email: magicshop@hogwarts.mail<br>
        © 2026 Магазин волшебства. Все права защищены.
    </div>
</footer>

<script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', function() {
        checkAuth();
        loadProfile();
        setupProfileTabs();
        loadCart();
        loadOrders();
        loadFavorites();
    });

    function checkAuth() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
            alert('Пожалуйста, войдите в систему');
            window.location.href = 'auth.html';
            return;
        }
        currentUser = JSON.parse(localStorage.getItem('currentUser'));
    }

    function loadProfile() {
        const profileInfo = document.getElementById('profile-info');
        
        if (currentUser) {
            profileInfo.innerHTML = `
                <div class="user-card">
                    <h2>${escapeHtml(currentUser.name)}</h2>
                    <p><strong>Email:</strong> ${escapeHtml(currentUser.email)}</p>
                    <p><strong>Роль:</strong> ${currentUser.role === 'admin' ? 'Администратор' : 'Волшебник'}</p>
                    <p><strong>Дата регистрации:</strong> ${new Date(currentUser.registrationDate).toLocaleDateString()}</p>
                </div>
            `;
        }
    }

    function setupProfileTabs() {
        document.querySelectorAll('.profile-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.profile-tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.profile-tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`${tab}-tab`).classList.add('active');
                
                // Обновляем данные при переключении
                if (tab === 'cart') loadCart();
                if (tab === 'orders') loadOrders();
                if (tab === 'favorites') loadFavorites();
            });
        });
    }

    // ========== КОРЗИНА ==========
    function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const container = document.getElementById('cart-items');
        const totalContainer = document.getElementById('cart-total');
        
        if (cart.length === 0) {
            container.innerHTML = '<p>Ваша корзина пуста</p>';
            totalContainer.innerHTML = '<strong>Общая сумма: 0 рублей</strong><button class="checkout-btn" onclick="checkout()">Оформить заказ</button>';
            return;
        }

        let total = 0;
        container.innerHTML = cart.map((item, index) => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            return `
                <div class="cart-item" data-index="${index}">
                    <div class="cart-item-info">
                        <h4>${escapeHtml(item.title)}</h4>
                        <p>${escapeHtml(item.description)}</p>
                        <div class="cart-item-price">${item.price} рублей × ${item.quantity} = ${itemTotal} рублей</div>
                    </div>
                    <div class="cart-item-actions">
                        <button onclick="updateQuantity(${index}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity(${index}, 1)">+</button>
                        <button class="remove-btn" onclick="removeFromCart(${index})">Удалить</button>
                    </div>
                </div>
            `;
        }).join('');

        totalContainer.innerHTML = `
            <strong>Общая сумма: ${total} рублей</strong>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        `;
    }

    function updateQuantity(index, change) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart[index]) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }
    }

    function removeFromCart(index) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
    }

    function checkout() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart.length === 0) {
            alert('Корзина пуста');
            return;
        }

        const address = prompt('Введите адрес доставки:');
        if (!address) return;

        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        const orders = JSON.parse(localStorage.getItem('orders')) || [];
        const newOrder = {
            id: Date.now(),
            date: new Date().toISOString(),
            items: [...cart],
            total: total,
            address: address,
            status: 'pending'
        };
        
        orders.push(newOrder);
        localStorage.setItem('orders', JSON.stringify(orders));
        localStorage.setItem('cart', '[]');
        
        alert(`Заказ оформлен! Сумма: ${total} рублей. Номер заказа: ${newOrder.id}`);
        loadCart();
        loadOrders();
        document.querySelector('.profile-tab-btn[data-tab="orders"]').click();
    }

    // ========== ЗАКАЗЫ ==========
    function loadOrders() {
        const orders = JSON.parse(localStorage.getItem('orders')) || [];
        const container = document.getElementById('orders-list');
        
        if (orders.length === 0) {
            container.innerHTML = '<p>У вас пока нет заказов</p>';
            return;
        }
        
        // Сортируем от новых к старым
        orders.reverse();
        
        const statusMap = {
            'pending': '⏳ Обрабатывается',
            'processing': '📦 В обработке',
            'delivered': '✅ Доставлен',
            'cancelled': '❌ Отменен'
        };
        
        container.innerHTML = orders.map(order => `
            <div class="order-item">
                <div class="order-header">
                    <span class="order-id">Заказ №${order.id}</span>
                    <span class="order-date">${new Date(order.date).toLocaleDateString()}</span>
                    <span class="order-status">${statusMap[order.status] || '⏳ Обрабатывается'}</span>
                </div>
                <div class="order-items">
                    ${order.items.map(item => `
                        <div class="order-item-detail">${escapeHtml(item.title)} x ${item.quantity} = ${item.price * item.quantity} руб.</div>
                    `).join('')}
                </div>
                ${order.address ? `<div class="address"><strong>📍 Адрес:</strong> ${escapeHtml(order.address)}</div>` : ''}
                <div class="order-total">Итого: ${order.total} рублей</div>
            </div>
        `).join('');
    }

    // ========== ИЗБРАННОЕ ==========
    function loadFavorites() {
        const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        const container = document.getElementById('favorites-list');
        
        if (favorites.length === 0) {
            container.innerHTML = '<p>У вас пока нет избранных товаров</p>';
            return;
        }
        
        container.innerHTML = favorites.map((item, index) => `
            <div class="favorite-item">
                <h4>${escapeHtml(item.title)}</h4>
                <p>${escapeHtml(item.description)}</p>
                <div class="favorite-price">${item.price} рублей</div>
                <button class="add-to-cart-small" onclick="addFavoriteToCart(${index})">В корзину</button>
                <button class="remove-btn" onclick="removeFavorite(${index})" style="margin-top: 10px;">Удалить из избранного</button>
            </div>
        `).join('');
    }

    function addFavoriteToCart(index) {
        const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        const product = favorites[index];
        if (!product) return;
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existingItem = cart.find(item => item.title === product.title);
        
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({
                ...product,
                quantity: 1
            });
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('Товар добавлен в корзину!');
    }

    function removeFavorite(index) {
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        favorites.splice(index, 1);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        loadFavorites();
    }

    function logout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('currentUser');
        alert('Вы вышли из системы');
        window.location.href = 'index.html';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>

<style>
    .order-item-detail {
        padding: 5px 0;
        border-bottom: 1px solid #eee;
    }
    .address {
        background: #f5f5f5;
        padding: 10px;
        border-radius: 8px;
        margin: 10px 0;
    }
    .add-to-cart-small {
        background: #800000;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
    }
</style>

</body>
</html>
