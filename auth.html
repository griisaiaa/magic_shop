<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Вход/Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-message { color: red; text-align: center; margin-bottom: 15px; display: none; }
        .success-message { color: green; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo" style="background-image: url('img/logo.png');"></div>
    </a>
    <nav class="nav">
        <a href="auth.html" class="active">Вход/регистрация</a>
        <a href="promotions.html">Акции</a>
        <a href="delivery.html">Доставка</a>
        <a href="admin.html">Админ панель</a>
        <a href="profile.html" id="profile-link" style="display: none;">Личный кабинет</a>
    </nav>
    <div class="search">
        <input type="text" placeholder="Найти...">
        <button>ОК</button>
    </div>
</header>

<div class="wrapper">
    <main class="content">
        <section class="auth-section">
            <div class="auth-container">
                <div id="errorMsg" class="error-message"></div>
                <div id="successMsg" class="success-message"></div>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Вход</button>
                    <button class="tab-btn" data-tab="register">Регистрация</button>
                </div>

                <div class="auth-forms">
                    <form class="auth-form active" id="login-form">
                        <h2>Вход в магический мир</h2>
                        <input type="email" id="login-email" placeholder="Ваш email" required>
                        <input type="password" id="login-password" placeholder="Пароль" required>
                        <button type="submit" class="auth-submit">Войти</button>
                    </form>

                    <form class="auth-form" id="register-form">
                        <h2>Стать частью магии</h2>
                        <input type="text" id="register-name" placeholder="Имя" required>
                        <input type="email" id="register-email" placeholder="Email" required>
                        <input type="password" id="register-password" placeholder="Пароль" required>
                        <input type="password" id="register-confirm" placeholder="Подтвердите пароль" required>
                        <button type="submit" class="auth-submit">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</div>

<footer class="footer">
    <div class="footer-content">
        Адрес: Улица Привет Драйв, дом 7, Лондон<br>
        Телефон: +7 (900) 123-45-67<br>
        Email: magicshop@hogwarts.mail<br>
        © 2026 Магазин волшебства. Все права защищены.
    </div>
</footer>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    
    const firebaseConfig = {
        apiKey: "AIzaSyC92UNkrbU2KHUZzTtLQggOa1qpa2hvFbs",
        authDomain: "magic-shop-285c1.firebaseapp.com",
        projectId: "magic-shop-285c1",
        storageBucket: "magic-shop-285c1.firebasestorage.app",
        messagingSenderId: "189566179161",
        appId: "1:189566179161:web:10b28c648af33cfd459e48"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }
    
    function showSuccess(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }
    
    // Переключение вкладок
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tab}-form`).classList.add('active');
        });
    });
    
    // Регистрация
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const confirm = document.getElementById('register-confirm').value;
        
        if (password !== confirm) {
            showError('Пароли не совпадают');
            return;
        }
        if (password.length < 6) {
            showError('Пароль должен быть минимум 6 символов');
            return;
        }
        
        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            // Проверяем, первый ли пользователь
            const usersSnapshot = await getDocs(collection(db, 'users'));
            const role = usersSnapshot.empty ? 'admin' : 'user';
            
            await setDoc(doc(db, 'users', user.uid), {
                name: name,
                email: email,
                role: role,
                registrationDate: new Date().toISOString()
            });
            
            showSuccess(role === 'admin' ? '🎉 Вы первый пользователь! Вы стали АДМИНИСТРАТОРОМ!' : '✅ Регистрация успешна! Теперь войдите.');
            
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = '';
            document.querySelector('.tab-btn[data-tab="login"]').click();
            
            document.getElementById('register-name').value = '';
            document.getElementById('register-email').value = '';
            document.getElementById('register-password').value = '';
            document.getElementById('register-confirm').value = '';
        } catch (error) {
            if (error.code === 'auth/email-already-in-use') {
                showError('Этот email уже зарегистрирован');
            } else {
                showError('Ошибка: ' + error.message);
            }
        }
    });
    
    // Вход
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        
        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            // Сохраняем в localStorage
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', JSON.stringify({
                id: user.uid,
                email: user.email
            }));
            
            showSuccess('Вход выполнен! Перенаправление...');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        } catch (error) {
            if (error.code === 'auth/invalid-credential') {
                showError('Неверный email или пароль');
            } else {
                showError('Ошибка: ' + error.message);
            }
        }
    });
</script>
</body>
</html>
