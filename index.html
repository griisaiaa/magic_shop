<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Главная</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-card { cursor: pointer; transition: transform 0.3s ease; position: relative; overflow: hidden; height: 200px; background-size: cover !important; background-position: center !important; border-radius: 10px; }
        .product-card:hover { transform: scale(1.05); }
        .buy-label { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(128,0,0,0.8); color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        .loading, .error { text-align: center; padding: 50px; font-size: 18px; }
        .error { color: red; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo" style="background-image: url('img/logo.png');"></div>
    </a>
    <nav class="nav">
        <a href="auth.html" id="auth-link">Вход/регистрация</a>
        <a href="promotions.html">Акции</a>
        <a href="delivery.html">Доставка</a>
        <a href="admin.html">Админ панель</a>
        <a href="profile.html" id="profile-link" style="display: none;">Личный кабинет</a>
    </nav>
    <div class="search">
        <input type="text" id="search-input" placeholder="Найти...">
        <button id="search-btn">ОК</button>
    </div>
</header>

<div class="wrapper">
    <main class="content">
        <section class="welcome"><p>Добро пожаловать в наш волшебный магазин!</p></section>
        <section class="products" id="products-list"><div class="loading">Загрузка...</div></section>
    </main>
    <aside class="scroll-gallery">
        <div class="photo" style="background-image: url('img/gallery1.jpg');"></div>
        <div class="photo" style="background-image: url('img/gallery2.jpg');"></div>
        <div class="photo" style="background-image: url('img/gallery3.jpg');"></div>
    </aside>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title"></h2>
        <div class="product-modal-body">
            <div class="product-image" id="modal-image"></div>
            <div class="product-info">
                <p id="modal-description"></p>
                <p class="product-price" id="modal-price"></p>
                <input type="number" id="quantity" value="1" min="1" max="10">
                <button class="add-to-cart-btn" onclick="addToCart()">В корзину</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer"><div class="footer-content">© 2026 Магазин волшебства</div></footer>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    
    const firebaseConfig = {
        apiKey: "AIzaSyC92UNkrbU2KHUZzTtLQggOa1qpa2hvFbs",
        authDomain: "magic-shop-285c1.firebaseapp.com",
        projectId: "magic-shop-285c1",
        storageBucket: "magic-shop-285c1.firebasestorage.app",
        messagingSenderId: "189566179161",
        appId: "1:189566179161:web:10b28c648af33cfd459e48"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentProduct = null;
    
    function checkAuthStatus() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const authLink = document.getElementById('auth-link');
        const profileLink = document.getElementById('profile-link');
        if (isLoggedIn === 'true') {
            if (authLink) authLink.style.display = 'none';
            if (profileLink) profileLink.style.display = 'inline';
        } else {
            if (authLink) authLink.style.display = 'inline';
            if (profileLink) profileLink.style.display = 'none';
        }
    }
    
    async function loadProducts() {
        try {
            const querySnapshot = await getDocs(collection(db, 'products'));
            const products = [];
            querySnapshot.forEach((doc) => products.push({ id: doc.id, ...doc.data() }));
            const container = document.getElementById('products-list');
            if (products.length === 0) { container.innerHTML = '<div class="loading">Нет товаров</div>'; return; }
            container.innerHTML = products.slice(0, 8).map(p => `
                <div class="product-card" style="background-image: url('${p.image}');" onclick='window.showProductModal(${JSON.stringify(p)})'>
                    <div class="buy-label">Купить</div>
                </div>
            `).join('');
        } catch (error) {
            document.getElementById('products-list').innerHTML = '<div class="error">Ошибка: ' + error.message + '</div>';
        }
    }
    
    window.showProductModal = function(product) {
        currentProduct = product;
        document.getElementById('modal-title').textContent = product.name;
        document.getElementById('modal-description').textContent = product.description;
        document.getElementById('modal-price').textContent = `Цена: ${product.price} руб.`;
        document.getElementById('modal-image').style.backgroundImage = `url('${product.image}')`;
        document.getElementById('productModal').style.display = 'block';
    };
    
    window.addToCart = function() {
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('Войдите в систему');
            location.href = 'auth.html';
            return;
        }
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(i => i.title === currentProduct.name);
        if (existing) existing.quantity += parseInt(document.getElementById('quantity').value);
        else cart.push({ ...currentProduct, title: currentProduct.name, quantity: parseInt(document.getElementById('quantity').value) });
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('✅ Добавлено!');
        document.getElementById('productModal').style.display = 'none';
    };
    
    document.querySelector('.close')?.addEventListener('click', () => document.getElementById('productModal').style.display = 'none');
    document.getElementById('search-btn')?.addEventListener('click', () => {
        const q = document.getElementById('search-input').value.trim();
        if (q) location.href = `products.html?search=${encodeURIComponent(q)}`;
    });
    
    checkAuthStatus();
    loadProducts();
</script>
</body>
</html>
