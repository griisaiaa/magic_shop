<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Админ Панель</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .admin-card {
            background: #D9D9D9;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .admin-card:hover {
            transform: translateY(-5px);
        }
        .admin-card h3 {
            color: #5D1717;
            margin-bottom: 10px;
        }
        .admin-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .admin-stats {
            background: #D9D9D9;
            padding: 25px;
            border-radius: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-item {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .stat-number {
            display: block;
            font-size: 2.5em;
            font-weight: bold;
            color: #800000;
        }
        .access-denied {
            text-align: center;
            padding: 50px;
            background: #D9D9D9;
            border-radius: 15px;
            color: #f44336;
        }
        .orders-list, .users-list {
            margin-top: 20px;
        }
        .order-card, .user-card-admin {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .status-select {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .delete-user-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .make-admin-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        .role-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .role-user {
            background: #2196F3;
            color: white;
        }
        .role-admin {
            background: #4CAF50;
            color: white;
        }
        .back-btn {
            background: #800000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .user-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo" style="background-image: url('img/logo.png');"></div>
    </a>
    <nav class="nav">
        <a href="auth.html">Вход/регистрация</a>
        <a href="promotions.html">Акции</a>
        <a href="delivery.html">Доставка</a>
        <a href="admin.html" class="active">Админ панель</a>
        <a href="profile.html" id="profile-link" style="display: none;">Личный кабинет</a>
    </nav>
    <div class="search">
        <input type="text" placeholder="Найти...">
        <button>ОК</button>
    </div>
</header>

<div class="wrapper">
    <main class="content">
        <section class="admin-section">
            <h1>⚡ Панель управления</h1>
            <div id="admin-content">
                <div class="loading">Загрузка...</div>
            </div>
        </section>
    </main>
</div>

<footer class="footer">
    <div class="footer-content">
        Адрес: Улица Привет Драйв, дом 7, Лондон<br>
        Телефон: +7 (900) 123-45-67<br>
        Email: magicshop@hogwarts.mail<br>
        © 2026 Магазин волшебства. Все права защищены.
    </div>
</footer>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    
    const firebaseConfig = {
        apiKey: "AIzaSyC92UNkrbU2KHUZzTtLQggOa1qpa2hvFbs",
        authDomain: "magic-shop-285c1.firebaseapp.com",
        projectId: "magic-shop-285c1",
        storageBucket: "magic-shop-285c1.firebasestorage.app",
        messagingSenderId: "189566179161",
        appId: "1:189566179161:web:10b28c648af33cfd459e48"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;
    
    // Функция для получения текущего пользователя из Firebase
    async function getCurrentUserFromFirebase() {
        return new Promise((resolve) => {
            const unsubscribe = auth.onAuthStateChanged(async (user) => {
                unsubscribe();
                if (user) {
                    const userDoc = await getDocs(query(collection(db, 'users'), where('email', '==', user.email)));
                    if (!userDoc.empty) {
                        const userData = userDoc.docs[0].data();
                        resolve({
                            id: user.uid,
                            email: user.email,
                            name: userData.name,
                            role: userData.role
                        });
                    } else {
                        resolve(null);
                    }
                } else {
                    resolve(null);
                }
            });
        });
    }
    
    // Проверка админа
    async function checkAdminAndLoad() {
        const container = document.getElementById('admin-content');
        container.innerHTML = '<div class="loading">Проверка прав доступа...</div>';
        
        // Получаем текущего пользователя из Firebase
        currentUser = await getCurrentUserFromFirebase();
        
        console.log('Текущий пользователь из Firebase:', currentUser);
        
        if (!currentUser) {
            container.innerHTML = `
                <div class="access-denied">
                    <h2>⛔ Вы не авторизованы</h2>
                    <p>Пожалуйста, <a href="auth.html">войдите в систему</a>.</p>
                </div>
            `;
            return false;
        }
        
        if (currentUser.role !== 'admin') {
            container.innerHTML = `
                <div class="access-denied">
                    <h2>⛔ Доступ запрещен</h2>
                    <p>Только администраторы могут входить в эту панель.</p>
                    <p>Ваша роль: ${currentUser.role || 'не определена'}</p>
                    <button onclick="location.href='index.html'" style="margin-top:20px; padding:10px 20px; background:#800000; color:white; border:none; border-radius:5px; cursor:pointer;">Вернуться на главную</button>
                </div>
            `;
            return false;
        }
        
        // Обновляем localStorage для других страниц
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        
        await loadMainPanel();
        return true;
    }
    
    async function loadMainPanel() {
        try {
            const usersSnapshot = await getDocs(collection(db, 'users'));
            const ordersSnapshot = await getDocs(collection(db, 'orders'));
            
            const users = [];
            usersSnapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
            
            const orders = [];
            ordersSnapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
            
            const todayOrders = orders.filter(o => {
                const today = new Date().toDateString();
                return new Date(o.date).toDateString() === today;
            }).length;
            
            const container = document.getElementById('admin-content');
            container.innerHTML = `
                <div class="admin-cards">
                    <div class="admin-card" onclick="window.loadOrdersPanel()">
                        <div class="admin-icon">📋</div>
                        <h3>Заказы</h3>
                        <p>Просмотр и обработка заказов</p>
                    </div>
                    <div class="admin-card" onclick="window.loadUsersPanel()">
                        <div class="admin-icon">👥</div>
                        <h3>Пользователи</h3>
                        <p>Управление клиентами</p>
                    </div>
                </div>
                <div class="admin-stats">
                    <h3>📊 Статистика магазина</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-number">${todayOrders}</span>
                            <span class="stat-label">Заказов сегодня</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">${users.length}</span>
                            <span class="stat-label">Всего пользователей</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">${orders.length}</span>
                            <span class="stat-label">Всего заказов</span>
                        </div>
                    </div>
                </div>
                <div id="admin-dynamic-panel"></div>
            `;
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('admin-content').innerHTML = '<div class="error">Ошибка загрузки: ' + error.message + '</div>';
        }
    }
    
    window.loadOrdersPanel = async function() {
        try {
            const ordersSnapshot = await getDocs(collection(db, 'orders'));
            const orders = [];
            ordersSnapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
            
            const panel = document.getElementById('admin-dynamic-panel');
            
            if (orders.length === 0) {
                panel.innerHTML = `
                    <button class="back-btn" onclick="window.loadMainPanel()">← Назад</button>
                    <div class="access-denied">Заказов пока нет</div>
                `;
                return;
            }
            
            const statusMap = {
                'pending': '⏳ Обрабатывается',
                'processing': '📦 В обработке',
                'delivered': '✅ Доставлен',
                'cancelled': '❌ Отменен'
            };
            
            panel.innerHTML = `
                <button class="back-btn" onclick="window.loadMainPanel()">← Назад</button>
                <h3>Список заказов</h3>
                <div class="orders-list">
                    ${orders.slice().reverse().map(order => `
                        <div class="order-card">
                            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                                <strong>Заказ №${order.id}</strong>
                                <span>📅 ${new Date(order.date).toLocaleString()}</span>
                                <span>👤 ${order.userId}</span>
                                <select class="status-select" onchange="window.updateOrderStatus('${order.id}', this.value)">
                                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>⏳ Обрабатывается</option>
                                    <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>📦 В обработке</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>✅ Доставлен</option>
                                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>❌ Отменен</option>
                                </select>
                            </div>
                            <div style="margin-top:10px; padding:10px; background:#f5f5f5; border-radius:5px;">
                                ${order.items ? order.items.map(item => `<div>📦 ${item.title} x ${item.quantity} = ${item.price * item.quantity} руб.</div>`).join('') : 'Нет товаров'}
                            </div>
                            ${order.address ? `<div style="margin-top:10px;">📍 Адрес: ${order.address}</div>` : ''}
                            <div style="margin-top:10px; text-align:right; font-weight:bold;">💰 Итого: ${order.total} руб.</div>
                        </div>
                    `).join('')}
                </div>
            `;
        } catch (error) {
            alert('Ошибка загрузки заказов: ' + error.message);
        }
    };
    
    window.updateOrderStatus = async function(orderId, newStatus) {
        try {
            await updateDoc(doc(db, 'orders', orderId), { status: newStatus });
            alert('✅ Статус заказа обновлен!');
            await window.loadOrdersPanel();
        } catch (error) {
            alert('❌ Ошибка: ' + error.message);
        }
    };
    
    window.loadUsersPanel = async function() {
        try {
            const usersSnapshot = await getDocs(collection(db, 'users'));
            const users = [];
            usersSnapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
            
            const panel = document.getElementById('admin-dynamic-panel');
            
            panel.innerHTML = `
                <button class="back-btn" onclick="window.loadMainPanel()">← Назад</button>
                <h3>Список пользователей</h3>
                <div class="users-list">
                    ${users.map(user => `
                        <div class="user-card-admin">
                            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                                <strong>ID: ${user.id.substring(0, 8)}...</strong>
                                <strong>👤 ${escapeHtml(user.name)}</strong>
                                <span>📧 ${escapeHtml(user.email)}</span>
                                <span class="role-badge ${user.role === 'admin' ? 'role-admin' : 'role-user'}">
                                    ${user.role === 'admin' ? '👑 Администратор' : '👤 Пользователь'}
                                </span>
                                <div class="user-actions">
                                    ${user.role !== 'admin' ? `<button class="make-admin-btn" onclick="window.makeAdmin('${user.id}')">👑 Сделать админом</button>` : ''}
                                    ${user.id !== currentUser?.id ? `<button class="delete-user-btn" onclick="window.deleteUser('${user.id}')">🗑️ Удалить</button>` : '<span style="color:#999;">(Это вы)</span>'}
                                </div>
                            </div>
                            <div style="margin-top:10px; color:#666; font-size:12px;">📅 Регистрация: ${new Date(user.registrationDate).toLocaleDateString()}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        } catch (error) {
            alert('Ошибка загрузки пользователей: ' + error.message);
        }
    };
    
    window.makeAdmin = async function(userId) {
        try {
            await updateDoc(doc(db, 'users', userId), { role: 'admin' });
            alert('✅ Пользователь теперь администратор!');
            await window.loadUsersPanel();
        } catch (error) {
            alert('❌ Ошибка: ' + error.message);
        }
    };
    
    window.deleteUser = async function(userId) {
        if (confirm('🗑️ Удалить пользователя? Все его заказы также будут удалены.')) {
            try {
                // Удаляем заказы пользователя
                const ordersQuery = query(collection(db, 'orders'), where('userId', '==', userId));
                const ordersSnapshot = await getDocs(ordersQuery);
                ordersSnapshot.forEach(async (orderDoc) => {
                    await deleteDoc(doc(db, 'orders', orderDoc.id));
                });
                
                // Удаляем пользователя
                await deleteDoc(doc(db, 'users', userId));
                alert('✅ Пользователь удален');
                await window.loadUsersPanel();
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }
    };
    
    window.loadMainPanel = loadMainPanel;
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Запуск проверки
    checkAdminAndLoad();
</script>
</body>
</html>
