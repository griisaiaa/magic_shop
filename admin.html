<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Админ Панель</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .admin-card {
            background: #D9D9D9;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .admin-card:hover {
            transform: translateY(-5px);
        }
        .admin-card h3 {
            color: #5D1717;
            margin-bottom: 10px;
        }
        .admin-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .admin-stats {
            background: #D9D9D9;
            padding: 25px;
            border-radius: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-item {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .stat-number {
            display: block;
            font-size: 2.5em;
            font-weight: bold;
            color: #800000;
        }
        .access-denied {
            text-align: center;
            padding: 50px;
            background: #D9D9D9;
            border-radius: 15px;
            color: #f44336;
        }
        .orders-list, .users-list {
            margin-top: 20px;
        }
        .order-card, .user-card-admin {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .status-select {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .delete-user-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .make-admin-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        .role-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .role-user {
            background: #2196F3;
            color: white;
        }
        .role-admin {
            background: #4CAF50;
            color: white;
        }
        .back-btn {
            background: #800000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .user-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo" style="background-image: url('img/logo.png');"></div>
    </a>
    <nav class="nav">
        <a href="auth.html">Вход/регистрация</a>
        <a href="promotions.html">Акции</a>
        <a href="delivery.html">Доставка</a>
        <a href="admin.html" class="active">Админ панель</a>
        <a href="profile.html" id="profile-link" style="display: none;">Личный кабинет</a>
    </nav>
    <div class="search">
        <input type="text" placeholder="Найти...">
        <button>ОК</button>
    </div>
</header>

<div class="wrapper">
    <main class="content">
        <section class="admin-section">
            <h1>⚡ Панель управления</h1>
            <div id="admin-content">
                <div class="loading">Загрузка...</div>
            </div>
        </section>
    </main>
</div>

<footer class="footer">
    <div class="footer-content">
        Адрес: Улица Привет Драйв, дом 7, Лондон<br>
        Телефон: +7 (900) 123-45-67<br>
        Email: magicshop@hogwarts.mail<br>
        © 2026 Магазин волшебства. Все права защищены.
    </div>
</footer>

<script type="module" src="firebase-api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        checkAuthStatus();
        
        if (!currentUser || currentUser.role !== 'admin') {
            document.getElementById('admin-content').innerHTML = `
                <div class="access-denied">
                    <h2>⛔ Доступ запрещен</h2>
                    <p>Только администраторы могут входить в эту панель.</p>
                    <button onclick="location.href='index.html'" style="margin-top:20px; padding:10px 20px; background:#800000; color:white; border:none; border-radius:5px; cursor:pointer;">Вернуться на главную</button>
                </div>
            `;
            return;
        }
        
        await loadMainPanel();
    });

    async function loadMainPanel() {
        try {
            const users = await getAllUsers();
            const orders = await getAllOrders();
            
            const todayOrders = orders.filter(o => {
                const today = new Date().toDateString();
                return new Date(o.order_date).toDateString() === today;
            }).length;
            
            const container = document.getElementById('admin-content');
            container.innerHTML = `
                <div class="admin-cards">
                    <div class="admin-card" onclick="loadOrdersPanel()">
                        <div class="admin-icon">📋</div>
                        <h3>Заказы</h3>
                        <p>Просмотр и обработка заказов</p>
                    </div>
                    <div class="admin-card" onclick="loadUsersPanel()">
                        <div class="admin-icon">👥</div>
                        <h3>Пользователи</h3>
                        <p>Управление клиентами</p>
                    </div>
                </div>
                <div class="admin-stats">
                    <h3>📊 Статистика магазина</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-number">${todayOrders}</span>
                            <span class="stat-label">Заказов сегодня</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">${users.length}</span>
                            <span class="stat-label">Всего пользователей</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">${orders.length}</span>
                            <span class="stat-label">Всего заказов</span>
                        </div>
                    </div>
                </div>
                <div id="admin-dynamic-panel"></div>
            `;
        } catch (error) {
            console.error('Error loading admin panel:', error);
            document.getElementById('admin-content').innerHTML = '<div class="error">Ошибка загрузки данных</div>';
        }
    }

    async function loadOrdersPanel() {
        try {
            const orders = await getAllOrders();
            const panel = document.getElementById('admin-dynamic-panel');
            
            if (orders.length === 0) {
                panel.innerHTML = `
                    <button class="back-btn" onclick="loadMainPanel()">← Назад</button>
                    <div class="access-denied">Заказов пока нет</div>
                `;
                return;
            }
            
            const statusMap = {
                'pending': '⏳ Обрабатывается',
                'processing': '📦 В обработке',
                'delivered': '✅ Доставлен',
                'cancelled': '❌ Отменен'
            };
            
            panel.innerHTML = `
                <button class="back-btn" onclick="loadMainPanel()">← Назад</button>
                <h3>Список заказов</h3>
                <div class="orders-list">
                    ${orders.slice().reverse().map(order => `
                        <div class="order-card">
                            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                                <strong>Заказ №${order.id}</strong>
                                <span>📅 ${new Date(order.order_date).toLocaleString()}</span>
                                <span>👤 ${order.user_name || 'Пользователь'}</span>
                                <select class="status-select" onchange="updateOrderStatus(${order.id}, this.value)">
                                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>⏳ Обрабатывается</option>
                                    <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>📦 В обработке</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>✅ Доставлен</option>
                                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>❌ Отменен</option>
                                </select>
                            </div>
                            <div style="margin-top:10px; padding:10px; background:#f5f5f5; border-radius:5px;">
                                ${order.items.map(item => `<div>📦 ${item.product_name} x ${item.quantity} = ${item.price * item.quantity} руб.</div>`).join('')}
                            </div>
                            ${order.address ? `<div style="margin-top:10px;">📍 Адрес: ${order.address}</div>` : ''}
                            <div style="margin-top:10px; text-align:right; font-weight:bold;">💰 Итого: ${order.total_amount} руб.</div>
                        </div>
                    `).join('')}
                </div>
            `;
        } catch (error) {
            alert('Ошибка загрузки заказов');
        }
    }

    async function updateOrderStatus(orderId, newStatus) {
        try {
            await updateOrderStatus(orderId, newStatus);
            alert('✅ Статус заказа обновлен!');
            await loadOrdersPanel();
        } catch (error) {
            alert('❌ Ошибка обновления статуса');
        }
    }

    async function loadUsersPanel() {
        try {
            const users = await getAllUsers();
            const panel = document.getElementById('admin-dynamic-panel');
            
            panel.innerHTML = `
                <button class="back-btn" onclick="loadMainPanel()">← Назад</button>
                <h3>Список пользователей</h3>
                <div class="users-list">
                    ${users.map(user => `
                        <div class="user-card-admin">
                            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                                <strong>ID: ${user.id}</strong>
                                <strong>👤 ${escapeHtml(user.name)}</strong>
                                <span>📧 ${escapeHtml(user.email)}</span>
                                <span class="role-badge ${user.role === 'admin' ? 'role-admin' : 'role-user'}">
                                    ${user.role === 'admin' ? '👑 Администратор' : '👤 Пользователь'}
                                </span>
                                <div class="user-actions">
                                    ${user.role !== 'admin' ? `<button class="make-admin-btn" onclick="makeAdmin(${user.id})">👑 Сделать админом</button>` : ''}
                                    ${user.id !== currentUser.id ? `<button class="delete-user-btn" onclick="deleteUser(${user.id})">🗑️ Удалить</button>` : '<span style="color:#999;">(Это вы)</span>'}
                                </div>
                            </div>
                            <div style="margin-top:10px; color:#666; font-size:12px;">📅 Регистрация: ${new Date(user.registration_date).toLocaleDateString()}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        } catch (error) {
            alert('Ошибка загрузки пользователей');
        }
    }

    async function makeAdmin(userId) {
        try {
            await updateUserRole(userId, 'admin');
            alert(`✅ Пользователь теперь администратор!`);
            await loadUsersPanel();
        } catch (error) {
            alert('❌ Ошибка изменения роли');
        }
    }

    async function deleteUser(userId) {
        if (confirm('🗑️ Удалить пользователя? Все его заказы также будут удалены.')) {
            try {
                await deleteUser(userId);
                alert('✅ Пользователь удален');
                await loadUsersPanel();
            } catch (error) {
                alert('❌ Ошибка удаления');
            }
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
