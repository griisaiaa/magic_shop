<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Товары</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-item {
            background: #D9D9D9;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .product-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .product-item-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .product-item-info {
            padding: 15px;
        }
        .product-item-info h3 {
            color: #5D1717;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .product-item-info p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            height: 40px;
            overflow: hidden;
        }
        .product-item-price {
            font-size: 1.2em;
            color: #800000;
            font-weight: bold;
            margin: 10px 0;
        }
        .buy-btn {
            width: 100%;
            padding: 10px;
            background: #800000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        .buy-btn:hover {
            background: #5a0000;
        }
        .no-results {
            text-align: center;
            padding: 50px;
            background: #D9D9D9;
            border-radius: 15px;
            color: #666;
        }
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #800000;
            background: white;
            color: #800000;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #800000;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #800000;
        }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo" style="background-image: url('img/logo.png');"></div>
    </a>

    <nav class="nav">
        <a href="auth.html" id="auth-link">Вход/регистрация</a>
        <a href="promotions.html">Акции</a>
        <a href="delivery.html">Доставка</a>
        <a href="admin.html">Админ панель</a>
        <a href="profile.html" id="profile-link" style="display: none;">Личный кабинет</a>
    </nav>

    <div class="search">
        <input type="text" id="search-input" placeholder="Найти...">
        <button id="search-btn">ОК</button>
    </div>
</header>

<div class="wrapper">
    <main class="content">
        <section class="products-section">
            <h1 id="category-title">Все товары</h1>
            <div class="category-filter">
                <button class="filter-btn active" data-category="all">Все</button>
                <button class="filter-btn" data-category="wands">Палочки</button>
                <button class="filter-btn" data-category="robes">Мантии</button>
                <button class="filter-btn" data-category="brooms">Метлы</button>
                <button class="filter-btn" data-category="books">Книги</button>
            </div>

            <div id="products-grid" class="products-grid">
                <div class="loading">Загрузка товаров...</div>
            </div>
        </section>
    </main>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title">Название товара</h2>
        <div class="product-modal-body">
            <div class="product-image" id="modal-image"></div>
            <div class="product-info">
                <p id="modal-description">Описание товара</p>
                <p class="product-price" id="modal-price">Цена: 0 рублей</p>
                <div class="quantity-selector">
                    <label>Количество:</label>
                    <input type="number" id="quantity" value="1" min="1" max="10">
                </div>
                <button class="add-to-cart-btn" onclick="addToCart()">Добавить в корзину</button>
                <button class="add-to-favorites-btn" onclick="addToFavorites()" style="margin-top:10px; background:#4CAF50;">⭐ В избранное</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        Адрес: Улица Привет Драйв, дом 7, Лондон<br>
        Телефон: +7 (900) 123-45-67<br>
        Email: magicshop@hogwarts.mail<br>
        © 2026 Магазин волшебства. Все права защищены.
    </div>
</footer>

<script type="module" src="firebase-api.js"></script>
<script>
    let currentProduct = null;
    let allProducts = [];

    document.addEventListener('DOMContentLoaded', async function() {
        checkAuthStatus();
        await loadProducts();
        setupFilters();
        setupSearch();
        setupModal();
    });

    async function loadProducts() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('category');
            const searchQuery = urlParams.get('search');
            
            let products = await getProducts();
            allProducts = products;
            
            // Фильтр по категории
            if (category && category !== 'all') {
                products = products.filter(p => p.category === category);
                document.getElementById('category-title').textContent = getCategoryName(category);
                
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.category === category) {
                        btn.classList.add('active');
                    }
                });
            } else {
                document.getElementById('category-title').textContent = 'Все товары';
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.category === 'all') {
                        btn.classList.add('active');
                    }
                });
            }
            
            // Фильтр по поиску
            if (searchQuery) {
                products = products.filter(p => 
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    p.description.toLowerCase().includes(searchQuery.toLowerCase())
                );
                document.getElementById('category-title').textContent = `Результаты поиска: "${searchQuery}"`;
            }
            
            // Отображение товаров
            const grid = document.getElementById('products-grid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="no-results">😕 Ничего не найдено</div>';
                return;
            }
            
            grid.innerHTML = products.map(product => `
                <div class="product-item" onclick="showProductModal(${product.id})">
                    <div class="product-item-image" style="background-image: url('${product.image}')"></div>
                    <div class="product-item-info">
                        <h3>${escapeHtml(product.name)}</h3>
                        <p>${escapeHtml(product.description)}</p>
                        <div class="product-item-price">${product.price} рублей</div>
                        <button class="buy-btn" onclick="event.stopPropagation(); addToCartDirect(${product.id}, 1)">В корзину</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error('Error loading products:', error);
            document.getElementById('products-grid').innerHTML = '<div class="no-results">❌ Ошибка загрузки товаров</div>';
        }
    }

    function addToCartDirect(productId, quantity) {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
            alert('Пожалуйста, войдите в систему');
            location.href = 'auth.html';
            return;
        }
        
        const product = allProducts.find(p => p.id === productId);
        if (!product) return;
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existingItem = cart.find(item => item.title === product.name);
        
        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            cart.push({
                title: product.name,
                description: product.description,
                price: product.price,
                category: product.category,
                imageUrl: product.image,
                quantity: quantity
            });
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('✅ Товар добавлен в корзину!');
    }

    function setupFilters() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const category = this.dataset.category;
                if (category === 'all') {
                    window.location.href = 'products.html';
                } else {
                    window.location.href = `products.html?category=${category}`;
                }
            });
        });
    }

    function setupSearch() {
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('search');
        if (searchQuery && searchInput) {
            searchInput.value = searchQuery;
        }
        
        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) {
                window.location.href = `products.html?search=${encodeURIComponent(query)}`;
            } else {
                window.location.href = 'products.html';
            }
        });
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `products.html?search=${encodeURIComponent(query)}`;
                } else {
                    window.location.href = 'products.html';
                }
            }
        });
    }

    function getCategoryName(category) {
        const names = {
            'wands': 'Волшебные палочки',
            'robes': 'Мантии',
            'brooms': 'Метлы',
            'books': 'Книги'
        };
        return names[category] || 'Все товары';
    }

    function setupModal() {
        const modal = document.getElementById('productModal');
        const closeBtn = document.querySelector('.close');
        
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }
        
        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    }

    function showProductModal(productId) {
        const product = allProducts.find(p => p.id === productId);
        if (!product) return;
        
        currentProduct = product;
        document.getElementById('modal-title').textContent = product.name;
        document.getElementById('modal-description').textContent = product.description;
        document.getElementById('modal-price').textContent = `Цена: ${product.price} рублей`;
        document.getElementById('quantity').value = 1;
        document.getElementById('modal-image').style.backgroundImage = `url('${product.image}')`;
        document.getElementById('productModal').style.display = 'block';
    }

    function addToCart() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
            alert('Пожалуйста, войдите в систему');
            location.href = 'auth.html';
            return;
        }

        const quantity = parseInt(document.getElementById('quantity').value);
        const product = currentProduct;

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existingItem = cart.find(item => item.title === product.name);
        
        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            cart.push({
                title: product.name,
                description: product.description,
                price: product.price,
                category: product.category,
                imageUrl: product.image,
                quantity: quantity
            });
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('✅ Товар добавлен в корзину!');
        document.getElementById('productModal').style.display = 'none';
    }

    async function addToFavorites() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
            alert('Пожалуйста, войдите в систему');
            location.href = 'auth.html';
            return;
        }

        const product = currentProduct;
        if (!product) return;

        try {
            await addToFavorites(currentUser.id, product.name, product.price, product.image);
            alert('⭐ Товар добавлен в избранное!');
        } catch (error) {
            if (error.message === 'Favorite already exists') {
                alert('⭐ Этот товар уже в избранном!');
            } else {
                alert('❌ Ошибка добавления в избранное');
            }
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
