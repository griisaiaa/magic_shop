<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Товары</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-item {
            background: #D9D9D9;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .product-item:hover {
            transform: translateY(-5px);
        }
        .product-item-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
        }
        .product-item-info {
            padding: 15px;
        }
        .product-item-info h3 {
            color: #5D1717;
            margin-bottom: 10px;
        }
        .product-item-price {
            font-size: 1.2em;
            color: #800000;
            font-weight: bold;
        }
        .buy-btn {
            width: 100%;
            padding: 10px;
            background: #800000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #800000;
            background: white;
            color: #800000;
            border-radius: 25px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #800000;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo-link">
        <div class="logo" style="background-image: url('img/logo.png');"></div>
    </a>
    <nav class="nav">
        <a href="auth.html" id="auth-link">Вход/регистрация</a>
        <a href="promotions.html">Акции</a>
        <a href="delivery.html">Доставка</a>
        <a href="admin.html">Админ панель</a>
        <a href="profile.html" id="profile-link" style="display: none;">Личный кабинет</a>
    </nav>
    <div class="search">
        <input type="text" id="search-input" placeholder="Найти...">
        <button id="search-btn">ОК</button>
    </div>
</header>

<div class="wrapper">
    <main class="content">
        <section class="products-section">
            <h1 id="category-title">Все товары</h1>
            <div class="category-filter">
                <button class="filter-btn active" data-category="all">Все</button>
                <button class="filter-btn" data-category="wands">Палочки</button>
                <button class="filter-btn" data-category="robes">Мантии</button>
                <button class="filter-btn" data-category="brooms">Метлы</button>
                <button class="filter-btn" data-category="books">Книги</button>
            </div>
            <div id="products-grid" class="products-grid">
                <div class="loading">Загрузка товаров...</div>
            </div>
        </section>
    </main>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title"></h2>
        <div class="product-modal-body">
            <div class="product-image" id="modal-image"></div>
            <div class="product-info">
                <p id="modal-description"></p>
                <p class="product-price" id="modal-price"></p>
                <div class="quantity-selector">
                    <label>Количество:</label>
                    <input type="number" id="quantity" value="1" min="1" max="10">
                </div>
                <button class="add-to-cart-btn" onclick="addToCart()">Добавить в корзину</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        Адрес: Улица Привет Драйв, дом 7, Лондон<br>
        Телефон: +7 (900) 123-45-67<br>
        Email: magicshop@hogwarts.mail<br>
        © 2026 Магазин волшебства. Все права защищены.
    </div>
</footer>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    
    const firebaseConfig = {
        apiKey: "AIzaSyC92UNkrbU2KHUZzTtLQggOa1qpa2hvFbs",
        authDomain: "magic-shop-285c1.firebaseapp.com",
        projectId: "magic-shop-285c1",
        storageBucket: "magic-shop-285c1.firebasestorage.app",
        messagingSenderId: "189566179161",
        appId: "1:189566179161:web:10b28c648af33cfd459e48"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allProducts = [];
    let currentProduct = null;
    
    // Функция проверки авторизации (ОБЯЗАТЕЛЬНО)
    function checkAuthStatus() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const authLink = document.getElementById('auth-link');
        const profileLink = document.getElementById('profile-link');
        
        if (isLoggedIn === 'true') {
            if (authLink) authLink.style.display = 'none';
            if (profileLink) profileLink.style.display = 'inline';
        } else {
            if (authLink) authLink.style.display = 'inline';
            if (profileLink) profileLink.style.display = 'none';
        }
    }
    
    async function loadProducts() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('category');
            const searchQuery = urlParams.get('search');
            
            let q = collection(db, 'products');
            if (category && category !== 'all') {
                q = query(collection(db, 'products'), where('category', '==', category));
            }
            
            const querySnapshot = await getDocs(q);
            let products = [];
            querySnapshot.forEach((doc) => {
                products.push({ id: doc.id, ...doc.data() });
            });
            allProducts = products;
            
            if (searchQuery) {
                products = products.filter(p => 
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    p.description.toLowerCase().includes(searchQuery.toLowerCase())
                );
                document.getElementById('category-title').textContent = `Результаты поиска: "${searchQuery}"`;
            } else if (category && category !== 'all') {
                document.getElementById('category-title').textContent = getCategoryName(category);
            } else {
                document.getElementById('category-title').textContent = 'Все товары';
            }
            
            const grid = document.getElementById('products-grid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="no-results">😕 Ничего не найдено</div>';
                return;
            }
            
            grid.innerHTML = products.map(product => `
                <div class="product-item" onclick="showProductModal(${product.id})">
                    <div class="product-item-image" style="background-image: url('${product.image}')"></div>
                    <div class="product-item-info">
                        <h3>${escapeHtml(product.name)}</h3>
                        <p>${escapeHtml(product.description)}</p>
                        <div class="product-item-price">${product.price} рублей</div>
                        <button class="buy-btn" onclick="event.stopPropagation(); addToCartDirect(${product.id})">В корзину</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('products-grid').innerHTML = '<div class="error">Ошибка загрузки</div>';
        }
    }
    
    window.showProductModal = function(productId) {
        const product = allProducts.find(p => p.id == productId);
        if (!product) return;
        currentProduct = product;
        document.getElementById('modal-title').textContent = product.name;
        document.getElementById('modal-description').textContent = product.description;
        document.getElementById('modal-price').textContent = `Цена: ${product.price} рублей`;
        document.getElementById('quantity').value = 1;
        document.getElementById('modal-image').style.backgroundImage = `url('${product.image}')`;
        document.getElementById('modal-image').style.backgroundSize = 'cover';
        document.getElementById('modal-image').style.backgroundPosition = 'center';
        document.getElementById('productModal').style.display = 'block';
    };
    
    window.addToCartDirect = function(productId) {
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('Пожалуйста, войдите в систему');
            location.href = 'auth.html';
            return;
        }
        const product = allProducts.find(p => p.id == productId);
        if (!product) return;
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(i => i.title === product.name);
        if (existing) existing.quantity += 1;
        else cart.push({ title: product.name, description: product.description, price: product.price, category: product.category, imageUrl: product.image, quantity: 1 });
        
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('✅ Товар добавлен в корзину!');
    };
    
    window.addToCart = function() {
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('Войдите в систему');
            location.href = 'auth.html';
            return;
        }
        const quantity = parseInt(document.getElementById('quantity').value);
        const product = currentProduct;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(i => i.title === product.name);
        if (existing) existing.quantity += quantity;
        else cart.push({ ...product, title: product.name, quantity: quantity });
        
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('✅ Добавлено!');
        document.getElementById('productModal').style.display = 'none';
    };
    
    function getCategoryName(category) {
        const names = { 'wands': 'Палочки', 'robes': 'Мантии', 'brooms': 'Метлы', 'books': 'Книги' };
        return names[category] || 'Все товары';
    }
    
    function setupFilters() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const category = btn.dataset.category;
                window.location.href = category === 'all' ? 'products.html' : `products.html?category=${category}`;
            });
        });
    }
    
    function setupSearch() {
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('search');
        if (searchQuery && searchInput) searchInput.value = searchQuery;
        
        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            window.location.href = query ? `products.html?search=${encodeURIComponent(query)}` : 'products.html';
        });
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                window.location.href = query ? `products.html?search=${encodeURIComponent(query)}` : 'products.html';
            }
        });
    }
    
    function setupModal() {
        const modal = document.getElementById('productModal');
        const closeBtn = document.querySelector('.close');
        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (event) => { if (event.target === modal) modal.style.display = 'none'; };
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    // Запуск
    checkAuthStatus();
    loadProducts();
    setupFilters();
    setupSearch();
    setupModal();
</script>
</body>
</html>
